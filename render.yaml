services:
  - type: web
    name: masjid-management-api
    runtime: node
    rootDir: masjid-management/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: MASJID_AI_TOKEN
        sync: false
      - key: AI_ASK_URL
        sync: false
      - key: AI_ASK_KEY
        sync: false
